<!doctype html>
<!-- admin.html  (save in the SAME folder as app.html). Ememart admin panel, talks to the Supabase API. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ememart Admin</title>
<style>
  :root { --bg:#0b1210; --panel:#121c18; --line:#223029; --text:#e8f0ec; --mute:#8aa398; --ok:#34d399; --bad:#f87171; --warn:#fbbf24; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); gap:12px; flex-wrap:wrap; }
  header b { font-size:16px; }
  nav { display:flex; gap:6px; flex-wrap:wrap; padding:10px 16px; border-bottom:1px solid var(--line); }
  nav button, .btn { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; font:inherit; }
  nav button.on { background:var(--ok); color:#06201a; border-color:var(--ok); font-weight:600; }
  .btn.ok { background:var(--ok); color:#06201a; border-color:var(--ok); font-weight:600; }
  .btn.bad { background:transparent; color:var(--bad); border-color:var(--bad); }
  main { padding:16px; max-width:1000px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .grow { flex:1; min-width:140px; }
  input, select, textarea { background:#0b1210; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; width:100%; }
  .mute { color:var(--mute); } .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .big { font-size:22px; font-weight:700; }
  table { width:100%; border-collapse:collapse; } td, th { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  a { color:var(--ok); }
  #login { max-width:360px; margin:12vh auto; }
  .hidden { display:none !important; }
</style>
</head>
<body>

<section id="login" class="card hidden">
  <h2 style="margin-top:0">Ememart Admin</h2>
  <p class="mute">Sign in with your admin email.</p>
  <div class="row" style="flex-direction:column;align-items:stretch">
    <input id="l-email" type="email" placeholder="Email" autocomplete="username">
    <input id="l-pass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn ok" id="l-btn">Sign in</button>
    <div id="l-err" class="bad"></div>
  </div>
</section>

<section id="app" class="hidden">
  <header><b>Ememart Admin</b><span class="row"><span id="who" class="mute"></span><button class="btn" id="out">Sign out</button></span></header>
  <nav id="tabs"></nav>
  <main id="view"></main>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ---- YOUR SETTINGS (same two values as in backend.js) ----------------------------------------
var SUPABASE_URL = 'https://jjiiuwhybqagorygfarh.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_V87YLH0V1lQ_45ZHR_XiRw_zbi1bVLc';
// -----------------------------------------------------------------------------------------------
var API = SUPABASE_URL + '/functions/v1/api';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
var ROLE = null;
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function naira(k) { return '₦' + (Number(k || 0) / 100).toLocaleString('en-NG', { minimumFractionDigits: 2 }); }
function when(d) { return d ? new Date(d).toLocaleString('en-NG', { dateStyle: 'medium', timeStyle: 'short' }) : ''; }
function safeUrl(u) { return /^https:\/\//.test(u || '') ? u : ''; }

async function api(method, path, body) {
  var s = (await sb.auth.getSession()).data.session;
  var res;
  try {
    res = await fetch(API + path, { method: method, body: body ? JSON.stringify(body) : undefined,
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + (s ? s.access_token : '') } });
  } catch (e) { return { ok: false, error: 'Connection failed' }; }
  var data = {}; try { data = await res.json(); } catch (e) {}
  data._ok = res.ok; if (!res.ok) data._err = data.error || 'Request failed';
  return data;
}
function say(msg, bad) { alert(msg); }

// ---- sign in / out ---------------------------------------------------------------------------
async function boot() {
  var s = (await sb.auth.getSession()).data.session;
  if (!s) { $('login').classList.remove('hidden'); $('app').classList.add('hidden'); return; }
  var me = await api('GET', '/me');
  ROLE = me.admin_role || null;
  if (!ROLE) { await sb.auth.signOut(); $('l-err').textContent = 'This account is not an admin.'; $('login').classList.remove('hidden'); $('app').classList.add('hidden'); return; }
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('who').textContent = (me.profile && me.profile.full_name || '') + ' (' + ROLE.replace('_', ' ') + ')';
  buildTabs();
}
$('l-btn').onclick = async function () {
  $('l-err').textContent = '';
  var r = await sb.auth.signInWithPassword({ email: $('l-email').value.trim(), password: $('l-pass').value });
  if (r.error) { $('l-err').textContent = 'Wrong email or password'; return; }
  boot();
};
$('out').onclick = async function () { await sb.auth.signOut(); location.reload(); };

// ---- tabs (only what this admin role may use) ------------------------------------------------
var TABS = [
  ['verifications', 'Verification', ['super_admin', 'verification_reviewer']],
  ['roles', 'Rider / artisan requests', ['super_admin', 'verification_reviewer']],
  ['disputes', 'Disputes', ['super_admin', 'support']],
  ['users', 'Users', ['super_admin', 'support', 'verification_reviewer']],
  ['broadcasts', 'Broadcasts', ['super_admin', 'support']],
  ['finance', 'Finance', ['super_admin', 'finance']],
  ['team', 'Admin team', ['super_admin']],
  ['audit', 'Activity log', ['super_admin']],
];
var VIEWS = {};
function buildTabs() {
  var box = $('tabs'); box.innerHTML = '';
  TABS.filter(function (t) { return t[2].indexOf(ROLE) >= 0; }).forEach(function (t, i) {
    var b = document.createElement('button'); b.textContent = t[1]; b.dataset.k = t[0];
    b.onclick = function () { open(t[0]); }; box.appendChild(b);
    if (i === 0) open(t[0]);
  });
}
function open(k) {
  Array.prototype.forEach.call($('tabs').children, function (b) { b.classList.toggle('on', b.dataset.k === k); });
  $('view').innerHTML = '<p class="mute">Loading…</p>'; VIEWS[k]();
}
function view(html) { $('view').innerHTML = html; }
function ask(msg) { var r = prompt(msg); return r && r.trim() ? r.trim() : null; }

// ---- verification ----------------------------------------------------------------------------
VIEWS.verifications = async function () {
  var r = await api('GET', '/admin/verifications?status=pending');
  if (!r._ok) return view('<p class="bad">' + esc(r._err) + '</p>');
  var list = r.requests || [];
  view('<h3>Pending verification (' + list.length + ')</h3>' + (list.length ? '' : '<p class="mute">Nothing waiting.</p>') +
    list.map(function (v) {
      var p = v.profiles || {};
      return '<div class="card"><div class="row"><b class="grow">' + esc(p.full_name) + '</b><span class="mute">' + esc(String(v.kind).toUpperCase()) + ' · ' + esc(when(v.created_at)) + '</span></div>' +
        '<div class="mute">' + esc(p.email) + ' · ' + esc(p.phone) + ' · ' + esc(p.role) + '</div>' +
        '<p>Document number: <b>' + esc(v.document_number || 'not given') + '</b></p>' +
        '<div class="row">' + (safeUrl(v.document_url) ? '<a target="_blank" rel="noopener" href="' + esc(v.document_url) + '">Open document</a>' : '') +
        (safeUrl(v.selfie_url) ? '<a target="_blank" rel="noopener" href="' + esc(v.selfie_url) + '">Open selfie</a>' : '') + '</div>' +
        '<div class="row" style="margin-top:10px"><button class="btn ok" data-a="approve" data-id="' + esc(v.id) + '">Approve</button>' +
        '<button class="btn bad" data-a="reject" data-id="' + esc(v.id) + '">Reject</button></div></div>';
    }).join(''));
  $('view').onclick = async function (e) {
    var b = e.target.closest('button[data-a]'); if (!b) return;
    var approve = b.dataset.a === 'approve', reason = null;
    if (!approve) { reason = ask('Reason for rejecting (the user will see this):'); if (!reason) return; }
    var x = await api('POST', '/admin/verifications/' + b.dataset.id + '/review', { approve: approve, reason: reason || undefined });
    if (!x._ok) return say(x._err); VIEWS.verifications();
  };
};

// ---- rider / artisan requests ----------------------------------------------------------------
VIEWS.roles = async function () {
  var r = await api('GET', '/admin/role-applications');
  if (!r._ok) return view('<p class="bad">' + esc(r._err) + '</p>');
  var list = r.applications || [];
  view('<h3>Account type change requests (' + list.length + ')</h3>' + (list.length ? '' : '<p class="mute">Nothing waiting.</p>') +
    list.map(function (a) {
      var p = a.profiles || {};
      return '<div class="card"><div class="row"><b class="grow">' + esc(p.full_name) + '</b><span>' + esc(a.role) + '</span></div>' +
        '<div class="mute">' + esc(p.phone) + ' · ' + esc(when(a.created_at)) + '</div><pre class="mute" style="white-space:pre-wrap">' + esc(JSON.stringify(a.details || {}, null, 1)) + '</pre>' +
        '<div class="row"><button class="btn ok" data-a="1" data-id="' + esc(a.id) + '">Approve</button><button class="btn bad" data-a="0" data-id="' + esc(a.id) + '">Decline</button></div></div>';
    }).join(''));
  $('view').onclick = async function (e) {
    var b = e.target.closest('button[data-a]'); if (!b) return;
    var approve = b.dataset.a === '1', reason = null;
    if (!approve) { reason = ask('Reason for declining:'); if (!reason) return; }
    var x = await api('POST', '/admin/role-applications/' + b.dataset.id + '/review', { approve: approve, reason: reason || undefined });
    if (!x._ok) return say(x._err); VIEWS.roles();
  };
};

// ---- disputes --------------------------------------------------------------------------------
VIEWS.disputes = async function () {
  var r = await api('GET', '/admin/disputes');
  if (!r._ok) return view('<p class="bad">' + esc(r._err) + '</p>');
  var list = r.disputes || [];
  view('<h3>Open disputes (' + list.length + ')</h3>' + (list.length ? '' : '<p class="mute">No open disputes.</p>') +
    list.map(function (d) {
      var o = d.orders || {}, snap = o.item_snapshot || {};
      return '<div class="card"><div class="row"><b class="grow">' + esc(snap.title || 'Order') + ' · ' + naira(o.amount_kobo) + '</b><span class="mute">' + esc(when(d.created_at)) + '</span></div>' +
        '<p>' + esc(d.reason) + '</p>' +
        '<div class="mute">Evidence: ' + ((d.dispute_evidence || []).map(function (e) { return safeUrl(e.url) ? '<a target="_blank" rel="noopener" href="' + esc(e.url) + '">file</a>' : ''; }).join(' ') || 'none') + '</div>' +
        '<div class="row" style="margin-top:10px"><button class="btn ok" data-w="buyer" data-id="' + esc(d.id) + '">Refund buyer</button>' +
        '<button class="btn" data-w="seller" data-id="' + esc(d.id) + '">Pay seller</button></div></div>';
    }).join(''));
  $('view').onclick = async function (e) {
    var b = e.target.closest('button[data-w]'); if (!b) return;
    var note = ask('Note explaining the decision (both sides will see it):'); if (!note) return;
    var x = await api('POST', '/admin/disputes/' + b.dataset.id + '/resolve', { outcome: b.dataset.w, note: note });
    if (!x._ok) return say(x._err); VIEWS.disputes();
  };
};

// ---- users -----------------------------------------------------------------------------------
VIEWS.users = function () {
  view('<div class="row"><input id="uq" class="grow" placeholder="Search name, phone or email"><button class="btn ok" id="ugo">Search</button></div><div id="ul"></div>');
  async function go() {
    var r = await api('GET', '/admin/users?q=' + encodeURIComponent($('uq').value));
    if (!r._ok) return $('ul').innerHTML = '<p class="bad">' + esc(r._err) + '</p>';
    $('ul').innerHTML = '<table><tr><th>Name</th><th>Contact</th><th>Role</th><th>Status</th><th></th></tr>' + (r.users || []).map(function (u) {
      return '<tr><td>' + esc(u.full_name) + (u.verified ? ' <span class="ok">✔ verified</span>' : '') + '</td><td class="mute">' + esc(u.email) + '<br>' + esc(u.phone) + '</td><td>' + esc(u.role) + '<br><span class="mute">' + esc(u.tier) + '</span></td>' +
        '<td class="' + (u.status === 'active' ? 'ok' : 'bad') + '">' + esc(u.status) + '</td><td><div class="row">' +
        (u.status === 'active' ? '<button class="btn bad" data-s="suspended" data-id="' + esc(u.id) + '">Suspend</button>' : '<button class="btn ok" data-s="active" data-id="' + esc(u.id) + '">Restore</button>') +
        (u.verified ? '<button class="btn" data-rv="1" data-id="' + esc(u.id) + '">Remove tick</button>' : '') + '</div></td></tr>';
    }).join('') + '</table>';
  }
  $('ugo').onclick = go; $('uq').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  $('view').onclick = async function (e) {
    var b = e.target.closest('button[data-id]'); if (!b) return;
    if (b.dataset.rv) {
      var why = ask('Reason for removing the blue tick:'); if (!why) return;
      var y = await api('POST', '/admin/users/' + b.dataset.id + '/revoke-verification', { reason: why });
      if (!y._ok) return say(y._err); return go();
    }
    var reason = b.dataset.s === 'suspended' ? ask('Reason for suspending (the user will see this):') : '';
    if (b.dataset.s === 'suspended' && !reason) return;
    var x = await api('POST', '/admin/users/' + b.dataset.id + '/status', { status: b.dataset.s, reason: reason || undefined });
    if (!x._ok) return say(x._err); go();
  };
  go();
};

// ---- finance ---------------------------------------------------------------------------------
VIEWS.finance = async function () {
  var a = await api('GET', '/admin/finance/summary'), w = await api('GET', '/admin/finance/withdrawals');
  if (!a._ok) return view('<p class="bad">' + esc(a._err) + '</p>');
  view('<div class="grid">' +
    '<div class="card"><div class="mute">User wallets</div><div class="big">' + naira(a.user_balances_kobo) + '</div></div>' +
    '<div class="card"><div class="mute">Held in escrow</div><div class="big">' + naira(a.escrow_held_kobo) + '</div></div>' +
    '<div class="card"><div class="mute">Platform fees earned</div><div class="big">' + naira(a.platform_fees_kobo) + '</div></div>' +
    '<div class="card"><div class="mute">Pending withdrawals</div><div class="big">' + esc(a.pending_withdrawals) + '</div></div>' +
    '<div class="card"><div class="mute">Open disputes</div><div class="big">' + esc(a.open_disputes) + '</div></div></div>' +
    '<h3>Recent withdrawals</h3><div class="card"><table><tr><th>When</th><th>Amount</th><th>Account</th><th>Status</th></tr>' +
    ((w.withdrawals || []).map(function (x) {
      return '<tr><td>' + esc(when(x.created_at)) + '</td><td>' + naira(x.amount_kobo) + '</td><td>' + esc(x.account_name) + '<br><span class="mute">' + esc(x.bank_code) + ' ' + esc(x.account_number) + '</span></td><td class="' + (x.status === 'success' ? 'ok' : x.status === 'failed' ? 'bad' : 'warn') + '">' + esc(x.status) + '</td></tr>';
    }).join('') || '<tr><td colspan="4" class="mute">None yet.</td></tr>') + '</table></div>');
};

// ---- admin team ------------------------------------------------------------------------------
VIEWS.team = function () {
  view('<div class="card"><h3 style="margin-top:0">Give or remove an admin role</h3>' +
    '<p class="mute">Type the email of someone who already has an Ememart account.</p>' +
    '<div class="row"><input id="te" class="grow" placeholder="Their email (they must already have an Ememart account)">' +
    '<select id="tr" style="width:auto"><option value="verification_reviewer">Verification Reviewer</option><option value="support">Support / Disputes</option><option value="finance">Finance</option><option value="super_admin">Super Admin</option><option value="">Remove admin access</option></select>' +
    '<button class="btn ok" id="tgo">Save</button></div></div>');
  $('tgo').onclick = async function () {
    var email = $('te').value.trim(); if (!email) return;
    var f = await api('GET', '/admin/users?q=' + encodeURIComponent(email));
    var u = (f.users || []).filter(function (x) { return (x.email || '').toLowerCase() === email.toLowerCase(); })[0];
    if (!u) return say('No user with that email.');
    var role = $('tr').value || null;
    if (!confirm((role ? 'Make ' + email + ' ' + role.replace('_', ' ') : 'Remove admin access for ' + email) + '?')) return;
    var x = await api('POST', '/admin/team', { user_id: u.id, role: role });
    say(x._ok ? 'Saved.' : x._err);
  };
};

// ---- broadcasts (scrolling notice at the top of the app) --------------------------------------
VIEWS.broadcasts = async function () {
  var r = await api('GET', '/admin/broadcasts');
  if (!r._ok) return view('<p class="bad">' + esc(r._err) + '</p>');
  var now = Date.now();
  view('<div class="card"><h3>Send a broadcast</h3>' +
    '<textarea id="bc-msg" rows="3" maxlength="400" placeholder="Message everyone will see scrolling at the top of the app (3 to 400 characters)" style="width:100%"></textarea>' +
    '<div class="row" style="margin-top:8px"><select id="bc-aud"><option value="all">Everyone</option><option value="buyer">Buyers</option><option value="vendor">Vendors</option><option value="rider">Riders</option><option value="artisan">Artisans</option></select>' +
    '<select id="bc-hrs"><option value="6">Show for 6 hours</option><option value="24" selected>Show for 1 day</option><option value="72">Show for 3 days</option><option value="168">Show for 7 days</option></select>' +
    '<span class="grow"></span><button class="btn ok" id="bc-send">Send broadcast</button></div></div>' +
    '<h3>Recent broadcasts</h3>' + ((r.broadcasts || []).length ? '' : '<p class="mute">None yet.</p>') +
    (r.broadcasts || []).map(function (b) {
      var live = b.active && new Date(b.ends_at).getTime() > now;
      return '<div class="card"><div class="row"><b class="grow">' + esc(b.audience === 'all' ? 'Everyone' : b.audience) + '</b><span class="' + (live ? '' : 'mute') + '">' + (live ? 'Live until ' + esc(when(b.ends_at)) : 'Ended') + '</span></div>' +
        '<div style="margin:6px 0">' + esc(b.message) + '</div>' +
        (live ? '<button class="btn bad" data-stop="' + esc(b.id) + '">Stop now</button>' : '') + '</div>';
    }).join(''));
  $('bc-send').onclick = async function () {
    var msg = $('bc-msg').value.trim();
    if (msg.length < 3) return alert('Write the message first.');
    if (!confirm('Send this to ' + $('bc-aud').options[$('bc-aud').selectedIndex].text.toLowerCase() + ' now?')) return;
    var x = await api('POST', '/admin/broadcasts', { message: msg, audience: $('bc-aud').value, hours: parseInt($('bc-hrs').value, 10) });
    if (!x._ok) return alert(x._err);
    VIEWS.broadcasts();
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-stop]'), function (b) {
    b.onclick = async function () {
      if (!confirm('Stop this broadcast now?')) return;
      var x = await api('DELETE', '/admin/broadcasts/' + b.dataset.stop);
      if (!x._ok) return alert(x._err);
      VIEWS.broadcasts();
    };
  });
};

// ---- activity log ----------------------------------------------------------------------------
VIEWS.audit = async function () {
  var r = await api('GET', '/admin/audit');
  if (!r._ok) return view('<p class="bad">' + esc(r._err) + '</p>');
  view('<div class="card"><table><tr><th>When</th><th>Action</th><th>Target</th><th>Details</th></tr>' + (r.entries || []).map(function (e) {
    return '<tr><td>' + esc(when(e.created_at)) + '</td><td>' + esc(e.action) + '</td><td class="mute">' + esc(String(e.target || '').slice(0, 8)) + '</td><td class="mute">' + esc(JSON.stringify(e.detail || {})) + '</td></tr>';
  }).join('') + '</table></div>');
};

boot();
</script>
</body>
</html>
